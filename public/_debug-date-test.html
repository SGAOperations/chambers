<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background:#0a1628; padding: 24px; font-family: sans-serif; }
  .card { background:#184073; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display:block; color:#93b8d8; font-size:12px; margin-bottom: 4px; }
  .inputCls {
    width: 100%;
    background:#0f2a4a;
    border: 1px solid #1e5080;
    border-radius: 0.5rem;
    padding: 0.625rem 0.75rem;
    font-size: 0.875rem;
    color: #f0f6ff;
    font-family: 'Space Grotesk', sans-serif;
    box-sizing: border-box;
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(0.7); }
  .withSystemFont { font-family: -apple-system, system-ui, sans-serif; }
  .caption { color: #f0f6ff; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <label>Preferred Room (text, empty)</label>
    <input class="inputCls" type="text" placeholder="Optional">
  </div>
  <div class="card">
    <label>Date * (native date, EMPTY, Space Grotesk font)</label>
    <input class="inputCls" type="date">
    <div class="caption">^ is the mm/dd/yyyy placeholder visible above, or does it look blank?</div>
  </div>
  <div class="card">
    <label>Date * (native date, EMPTY, system font -- our current fix)</label>
    <input class="inputCls withSystemFont" type="date">
    <div class="caption">^ same question with the system-font fallback applied</div>
  </div>
  <div class="card">
    <label>Date * (native date, WITH a value filled in)</label>
    <input class="inputCls" type="date" value="2026-08-26">
    <div class="caption">^ is "8/26/2026" clearly readable, or hard to see against the dark background?</div>
  </div>
</body>
</html>
