name: keep-warm

# Pings /api/cron/warm on production so a warm function instance -- with its
# Upstash connection already open -- is sitting ready for real dashboard loads.
#
# The route must not query Neon: this schedule is shorter than Neon's 5-minute
# suspend timeout, so a database ping here keeps the compute awake around the
# clock and burns the monthly CU-hour allowance (see the route's comment).
#
# A Vercel cron would be the natural home for this, but Hobby plans cap crons at
# once per day. GitHub Actions schedules run about every 5-15 min (they can lag
# or skip under load) which is close enough for keep-warm; public repos get
# unlimited Actions minutes.
#
# Set a CRON_SECRET repo secret matching the CRON_SECRET env var on Vercel so the
# endpoint is gated. If neither is set the endpoint still answers (one rate-limiter
# call only); if only one side is set the request 401s.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the dashboard functions
        run: |
          curl -fsS -m 30 --retry 2 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://chambers.northeasternsga.com/api/cron/warm
